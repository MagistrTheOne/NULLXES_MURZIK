### NULLXES MURZIK-32B — DPO alignment

model_name_or_path: /workspace/checkpoints/sft-32b/checkpoint-best
trust_remote_code: true

stage: dpo
do_train: true
finetuning_type: full
deepspeed: configs/training/ds_zero3_moe.json

dataset: murzik_dpo
dataset_dir: /workspace/data
template: murzik
cutoff_len: 8192

output_dir: /workspace/checkpoints/dpo-32b
logging_steps: 10
save_steps: 100
report_to: wandb
run_name: murzik-dpo-32b

pref_beta: 0.1
pref_loss: sigmoid

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 5.0e-7
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
gradient_checkpointing: true

moe_aux_loss_coef: 0.01

seed: 42
