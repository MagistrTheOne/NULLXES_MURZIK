### MURZIK-15B — Multilingual PT pilot (wiki + c4_en, local patched model)
### Memory: pure_bf16 + 8bit Adam, no DeepSpeed (15B full FT on 1× H200)

model_name_or_path: /workspace/models/murzik-15b
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: full

dataset: murzik_identity,wiki_en,wiki_ru,wiki_de,wiki_es,wiki_fr,wiki_zh,wiki_uk,c4_en
dataset_dir: /workspace/data
template: default
cutoff_len: 1024
preprocessing_num_workers: 2
dataloader_num_workers: 2
packing: false
overwrite_cache: false

output_dir: /workspace/checkpoints/pt-15b-multilingual
logging_steps: 10
save_steps: 500
save_total_limit: 3
plot_loss: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
max_steps: 500
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 50
weight_decay: 0.1
optim: adamw_bnb_8bit
bf16: true
pure_bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

seed: 42
