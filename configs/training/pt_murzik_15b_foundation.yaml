### MURZIK-15B — NULLXES foundation pre-training (production path)
### Data: ONLY local pt/murzik_pt.jsonl (build with scripts/build_foundation_corpus.py)
### NOT for smoke: wiki/c4 hub configs (pt_murzik_15b_fast_2x.yaml)

model_name_or_path: /workspace/models/murzik-15b
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: full
deepspeed: configs/training/ds_zero3_offload.json

dataset: murzik_pt
dataset_dir: /workspace/data
template: default
cutoff_len: 4096
preprocessing_num_workers: 8
dataloader_num_workers: 4
packing: true
overwrite_cache: false

output_dir: /workspace/checkpoints/pt-15b-foundation
logging_steps: 10
save_steps: 500
save_total_limit: 5
plot_loss: true
report_to: wandb
run_name: murzik-pt-15b-foundation

# Token math (2× H200, batch 2, accum 8, seq 4096): ~131k tok/step
# 200B tokens ≈ 1.5M steps — set max_steps or use num_train_epochs on full corpus
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.01
weight_decay: 0.1
adam_beta1: 0.9
adam_beta2: 0.95
max_grad_norm: 1.0
optim: adamw_torch
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

seed: 42
