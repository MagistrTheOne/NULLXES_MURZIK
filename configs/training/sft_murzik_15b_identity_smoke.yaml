### MURZIK-15B — identity SFT smoke (after PT)
model_name_or_path: /workspace/checkpoints/pt-15b-multilingual-2x
trust_remote_code: true
use_fast_tokenizer: false

stage: sft
do_train: true
finetuning_type: full

dataset: murzik_sft
dataset_dir: /workspace/data
template: murzik
cutoff_len: 2048

output_dir: /workspace/checkpoints/sft-15b-identity-smoke
logging_steps: 5
save_steps: 100
save_total_limit: 1
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-5
max_steps: 100
lr_scheduler_type: cosine
warmup_steps: 5
bf16: true
pure_bf16: true
optim: adamw_bnb_8bit
gradient_checkpointing: true
ddp_timeout: 180000000

seed: 42
