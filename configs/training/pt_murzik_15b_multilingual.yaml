### MURZIK-15B — Multilingual Pre-training (HF Wikipedia + mC4 mix)
### dataset mix: EN/RU/DE/ES/FR/ZH/UK + mc4 EN/RU

model_name_or_path: MagistrTheOne/murzik-15b-init
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: full
deepspeed: configs/training/ds_zero3_moe.json

dataset: wiki_en,wiki_ru,wiki_de,wiki_es,wiki_fr,wiki_zh,wiki_uk,mc4_en,mc4_ru
dataset_dir: /workspace/data
template: default
cutoff_len: 4096
preprocessing_num_workers: 8
packing: true
overwrite_cache: false

output_dir: /workspace/checkpoints/pt-15b-multilingual
logging_steps: 10
save_steps: 500
save_total_limit: 3
plot_loss: true
report_to: wandb
run_name: murzik-pt-15b-multilingual

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2.0e-4
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_steps: 500
weight_decay: 0.1
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

seed: 42
