### MURZIK-15B — Multilingual PT on 2× H200 (identity + sampled wiki + c4_en)
### Requires: HF_TOKEN, bitsandbytes, volume at /workspace

model_name_or_path: /workspace/checkpoints/pt-15b-multilingual
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: full

# murzik_identity first — NULLXES branding; then HF hubs (sampled, not full wiki)
dataset: murzik_identity,wiki_en,wiki_ru,wiki_de,wiki_es,wiki_fr,wiki_zh,wiki_uk,c4_en
dataset_dir: /workspace/data
template: default
cutoff_len: 2048
preprocessing_num_workers: 4
dataloader_num_workers: 4
packing: false
overwrite_cache: false

output_dir: /workspace/checkpoints/pt-15b-multilingual-2x
logging_steps: 10
save_steps: 1000
save_total_limit: 2
plot_loss: true
report_to: none

per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
max_steps: 3000
lr_scheduler_type: cosine
warmup_steps: 100
weight_decay: 0.1
optim: adamw_bnb_8bit
bf16: true
pure_bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000

seed: 42
