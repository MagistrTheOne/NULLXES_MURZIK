### MURZIK 15B pilot — Pre-training on 1× H200
### Run: bash scripts/llamafactory_train.sh configs/training/pt_murzik_15b_pilot.yaml

model_name_or_path: /workspace/models/murzik-15b
trust_remote_code: true

stage: pt
do_train: true
finetuning_type: full
deepspeed: configs/training/ds_zero3_moe.json

dataset: murzik_pt_demo
dataset_dir: /workspace/data
template: default
cutoff_len: 2048
preprocessing_num_workers: 4
packing: false

output_dir: /workspace/checkpoints/pt-15b-pilot
logging_steps: 5
save_steps: 100
save_total_limit: 2
plot_loss: true
report_to: none

per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 3.0e-4
max_steps: 200
lr_scheduler_type: cosine
warmup_steps: 10
weight_decay: 0.1
bf16: true
gradient_checkpointing: true

seed: 42
